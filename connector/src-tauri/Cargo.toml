[package]
name = "logiflow-connector"
version = "3.0.0"
description = "LogiFlow Local Printer & Scanner Connector"
authors = ["LogiFlow Engineering"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "logiflow_connector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-autostart  = "2"
tauri-plugin-updater    = "2"
tauri-plugin-shell      = "2"
actix-web      = { version = "4", features = ["macros"] }
actix-rt       = "2"
tokio          = { version = "1", features = ["full"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
uuid           = { version = "1", features = ["v4"] }
reqwest        = { version = "0.12", features = ["json", "native-tls"], default-features = false }
quick-xml      = "0.36"
socket2        = { version = "0.5", features = ["all"] }
dirs           = "5"
log            = "0.4"
env_logger     = "0.11"
flate2         = "1"
crc32fast      = "1"
base64         = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Com",
  "Win32_Foundation",
  "Win32_Devices_ImageAcquisition",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
